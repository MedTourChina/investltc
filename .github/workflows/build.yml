name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Validate channel data
        run: node scripts/validate.mjs

      - name: Test the eligibility engine
        run: npm test

      - name: Build
        run: npm run build

      - name: Check output
        run: |
          test -f dist/index.html
          test -f dist/matrix/index.html
          test -f dist/api/channels.json
          echo "pages: $(find dist -name '*.html' | wc -l)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: site/dist
          retention-days: 1
